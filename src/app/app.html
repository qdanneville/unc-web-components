<main>
  <h1>Bonjour, c'est notre première application Angular</h1>
  @for (user of users; track user.name) {
  <app-user-card [name]="user.name" [bio]="user.bio" [avatar]="user.avatar" (liked)="onLiked($event)"
    (isFollowed)="onFollowed($event, user.name)">
  </app-user-card>
  }
  <p>Total Likes : {{totalLikes}}</p>
  <hr />
  <app-stats-panel [followedUsers]="followedUsers"></app-stats-panel>
</main>
